      <div class="modal-content">
         <div class="modal-header">
            <h1 class="modal-title fs-5" id="exampleModalLabel">Login</h1>

         </div>

            <label for="login_name">Nome de utilizador</label>

            <input type="password" id ="login_pass">
         </div>

         <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <input type="submit" value="Login" class="btn btn-primary">
         </form>
         </div>
      </div>
   </div>
</div>

         </div>

         <div class="modal-body">
         <form id="formRegister">
            
            <label for="register_name">Nome de utilizador</label>
            <input type="text" id ="register_name">

            <input type="text" id ="register_confirm_name">

            <label for="register_confirm_pass">Reescrever password de utilizador</label>
            <input type="password" id ="register_confirm_pass">
         </div>

         <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
            <input type="submit" value="Register" class="btn btn-primary">
         </form>
         </div>
      </div>
   </div>
</div>
